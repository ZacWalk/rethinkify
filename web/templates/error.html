<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ code }} — {{ title }} | Rethinkify</title>
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#1b1d18" />
  <meta name="color-scheme" content="dark" />
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Rufina:wght@400;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css?v={{ asset_version }}" />
</head>

<body>
  <main class="error-page">
    <p class="eyebrow">Error {{ code }}</p>
    <h1>{{ title }}</h1>
    <p class="summary">{{ message }}</p>
    <nav class="social" aria-label="Recovery links">
      <a class="social-link" href="/">
        <span class="social-label">Go</span>
        <span class="social-handle">Back home</span>
      </a>
    </nav>
  </main>
</body>

</html>
