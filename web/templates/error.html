<!DOCTYPE html>
<html lang="en-GB">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ code }} — {{ title }} | Rethinkify</title>
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#0a0a0d" />
  <meta name="color-scheme" content="dark" />
  <link rel="icon" href="/static/favicon-c64.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Share+Tech+Mono&family=Sixtyfour:BLED,SCAN@0..100,-53..100&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css?v={{ asset_version }}" />
</head>

<body>
  <main class="error-page">
    <div class="c64">
      <div class="c64-screen">
        <div class="c64-lines" aria-hidden="true">
          <p class="c64-gap">    **** COMMODORE 64 BASIC V2 ****</p>
          <p class="c64-gap"> 64K RAM SYSTEM  38911 BASIC BYTES FREE</p>
          <p>READY.</p>
          {% if code == "404" %}
          <p>LOAD"THIS PAGE",8</p>
          <p>SEARCHING FOR THIS PAGE</p>
          <p>?FILE NOT FOUND  ERROR</p>
          {% else %}
          <p>RUN</p>
          <p>?OUT OF MEMORY  ERROR</p>
          {% endif %}
          <p>READY.</p>
        </div>
        <h1 class="c64-title">{{ title }} <span class="c64-code">(error {{ code }})</span></h1>
        <p class="c64-message">{{ message }}</p>
        <nav class="c64-links" aria-label="Recovery links">
          <p><span aria-hidden="true">LOAD"</span><a href="/">Home</a><span aria-hidden="true">",8</span></p>
        </nav>
        <p class="c64-cursor" aria-hidden="true"></p>
      </div>
    </div>
  </main>
</body>

</html>
