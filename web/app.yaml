runtime: python313

entrypoint: gunicorn -b :$PORT main:app

automatic_scaling:
  max_instances: 2

handlers:
  - url: /static/images
    static_dir: static/images
    secure: always
    expiration: "30d"

  - url: /static
    static_dir: static
    secure: always
    expiration: "7d"

  - url: /.*
    script: auto
    secure: always